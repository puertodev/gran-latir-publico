<!-- 404.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Make sure the icon path includes your base path -->
    <link rel="icon" type="image/svg+xml" href="/gran-latir-publico/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gran Latir</title>

    <!-- Start of the SPA redirect script for GitHub Pages -->
    <script type="text/javascript">
        (function(l) {
          if (l.search) {
            var q = {};
            l.search.slice(1).split('&').forEach(function(v) {
              var a = v.split('=');
              q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
            });
            if (q.p !== undefined) {
              window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + (q.p || '') +
                (q.q ? ('?' + q.q) : '') +
                l.hash
              );
            }
          }
        }(window.location))
    </script>
    <!-- End of the SPA redirect script -->

</head>
<body>
<div id="root"></div>
<!-- The build process will automatically add your main script here -->
</body>
</html>
