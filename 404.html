<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gran Latir - Redirecting...</title>
    <script type="text/javascript">
        // Get the path the user was trying to access.
        const path = window.location.pathname;

        // The base path of your repository.
        const repoName = '/gran-latir-publico/';

        // Check if the path is a sub-page of your app.
        if (path.startsWith(repoName)) {
          // Extract the part of the path after the repository name.
          const redirectTo = path.substring(repoName.length);

          // Store the intended path in sessionStorage.
          sessionStorage.setItem('redirectPath', redirectTo);
        }

        // Redirect to the root of the application.
        window.location.href = repoName;
    </script>
</head>
<body>
</body>
</html>
